<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project groups</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f1ea;
      color: #1c1915;
    }
    main {
      max-width: 64rem;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    h1 {
      font-size: 2rem;
      margin: 0 0 0.25rem;
    }
    .intro {
      margin-top: 0;
      color: #4a453c;
    }
    form {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 1rem 0;
    }
    label {
      font-size: 1rem;
    }
    input {
      font: inherit;
      width: 4.5rem;
      padding: 0.3rem 0.4rem;
    }
    #summary {
      margin: 0 0 1rem;
      font-size: 1.15rem;
    }
    #cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd4c4;
      padding: 0.85rem 0.95rem 1rem;
    }
    h2 {
      margin: 0;
      font-size: 1.25rem;
    }
    .size {
      margin: 0.15rem 0 0.6rem;
      color: #4a453c;
    }
    ul {
      margin: 0;
      padding-left: 1.1rem;
    }
    li {
      margin: 0.2rem 0;
    }
    .mix {
      margin: 0.75rem 0 0;
      color: #4a453c;
      font-size: 0.85rem;
    }
    @media (min-width: 960px) {
      #cards {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Project groups</h1>
    <p class="intro">Who is in each group, and whether the group mixes different kinds of students.</p>
    <form>
      <label for="group-count">Number of groups</label>
      <input id="group-count" type="number" min="1" max="30" value="8">
    </form>
    <p id="summary"></p>
    <section id="cards"></section>
  </main>
  <script>
    const STUDENTS = [
      { name: "Maya Ellison", kind: 0 },
      { name: "Jonah Patel", kind: 0 },
      { name: "Priya Shah", kind: 0 },
      { name: "Elena Vasquez", kind: 0 },
      { name: "Chris Nolan", kind: 0 },
      { name: "Amira Hassan", kind: 0 },
      { name: "Leo Park", kind: 0 },
      { name: "Sofia Rossi", kind: 0 },
      { name: "Noah Williams", kind: 0 },
      { name: "Hannah Brooks", kind: 0 },
      { name: "Omar Farouk", kind: 0 },
      { name: "Lily Chen", kind: 0 },
      { name: "Ethan Walsh", kind: 0 },
      { name: "Nora Kim", kind: 0 },
      { name: "Grace Adeyemi", kind: 0 },
      { name: "Ben Carter", kind: 0 },
      { name: "Isla Nguyen", kind: 1 },
      { name: "Marcus Bell", kind: 1 },
      { name: "Yara Haddad", kind: 1 },
      { name: "Theo Martin", kind: 1 },
      { name: "Chloe Berg", kind: 1 },
      { name: "Samir Kapoor", kind: 1 },
      { name: "Freya Olsen", kind: 1 },
      { name: "Andre Silva", kind: 2 },
      { name: "Mina Cho", kind: 2 },
      { name: "Lucas Meyer", kind: 2 },
      { name: "Aisha Diallo", kind: 2 },
      { name: "Owen Clarke", kind: 2 },
      { name: "Ruby Santos", kind: 2 },
      { name: "Felix Horvat", kind: 2 }
    ];

    function exampleGroups(nGroups) {
      const byKind = { 0: [], 1: [], 2: [] };
      for (const student of STUDENTS) {
        byKind[student.kind].push(student);
      }
      const order = [0, 1, 2].sort((a, b) => byKind[b].length - byKind[a].length);
      const line = order.flatMap((kind) => byKind[kind]);
      const groups = [];
      for (let number = 1; number <= nGroups; number += 1) {
        groups.push({
          group: number,
          members: [],
          cluster_counts: { 0: 0, 1: 0, 2: 0 }
        });
      }
      line.forEach((student, index) => {
        const group = groups[index % nGroups];
        group.members.push(student.name);
        group.cluster_counts[student.kind] += 1;
      });
      const missing = groups.filter((group) =>
        Object.values(group.cluster_counts).some((count) => count === 0)
      ).length;
      return {
        n_groups: nGroups,
        groups: groups,
        groups_missing_a_cluster: missing
      };
    }

    function render(data) {
      const summary = document.getElementById("summary");
      const missing = data.groups_missing_a_cluster;
      const missingText = missing === 1
        ? "1 is missing a kind of student"
        : missing + " are missing a kind of student";
      summary.textContent = data.n_groups + " groups. " + missingText + ".";

      const cards = document.getElementById("cards");
      cards.replaceChildren();
      for (const group of data.groups) {
        const card = document.createElement("article");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = "Group " + group.group;

        const size = document.createElement("p");
        size.className = "size";
        const count = group.members.length;
        size.textContent = count === 1 ? "1 student" : count + " students";

        const list = document.createElement("ul");
        for (const name of group.members) {
          const item = document.createElement("li");
          item.textContent = name;
          list.appendChild(item);
        }

        const mix = document.createElement("p");
        mix.className = "mix";
        const kinds = Object.keys(group.cluster_counts).sort((a, b) => a - b);
        mix.textContent = kinds
          .map((kind) => "Kind " + kind + ": " + group.cluster_counts[kind])
          .join(" · ");

        card.append(title, size, list, mix);
        cards.appendChild(card);
      }
    }

    const input = document.getElementById("group-count");
    function show() {
      const count = Number(input.value);
      if (!Number.isInteger(count) || count < 1) {
        return;
      }
      render(exampleGroups(count));
    }
    input.addEventListener("input", show);
    document.querySelector("form").addEventListener("submit", (event) => {
      event.preventDefault();
      show();
    });
    show();
  </script>
</body>
</html>
